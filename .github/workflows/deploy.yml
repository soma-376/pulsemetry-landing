# 랜딩 정적 사이트를 S3 + CloudFront로 배포한다 (PROJ-327, infra ADR-0060).
# AWS 권한은 infra DeployStack의 github-deploy-pulsemetry-landing-prod 역할을 OIDC로 받는다.
# 이 역할은 main 브랜치의 push에서만 맡을 수 있다.
name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://www.pulsemetry.co.kr
  S3_BUCKET: pulsemetry-landing-prod

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: out/
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC 토큰 발급
      contents: read
    # 배포가 겹치면 뒤 배포가 앞 배포의 업로드를 덮어쓰지 않도록 순서대로 실행한다.
    concurrency:
      group: deploy-landing-prod
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 붙은 정적 자산은 1년 캐시한다. 지난 빌드의 청크는 열려 있던 페이지를 위해 지우지 않는다.
      - name: Upload hashed assets
        run: >
          aws s3 sync out/_next/static "s3://${S3_BUCKET}/_next/static"
          --cache-control "public,max-age=31536000,immutable"

      # HTML·RSC payload·이미지·robots·sitemap은 매번 재검증한다.
      - name: Upload pages
        run: >
          aws s3 sync out "s3://${S3_BUCKET}"
          --delete --exclude "_next/static/*"
          --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
